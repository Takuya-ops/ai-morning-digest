name: daily-digest

on:
  schedule:
    # 20:30 UTC = 翌朝 5:30 JST(GitHub Actionsのcronは数分〜数十分遅延することがあります)
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      retry_audio:
        description: 'Retry audio for the currently published text without generating new summaries'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Reuse the published text for audio retry
        if: inputs.retry_audio
        run: |
          mkdir -p .work
          cp docs/data/latest.json .work/digest-input.json

      - name: Generate text
        if: ${{ !inputs.retry_audio }}
        run: node src/index.js
        env:
          DIGEST_PHASE: text
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION || secrets.AZURE_SPEECH_REGION }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "digest: $(TZ=Asia/Tokyo date +%F)"
            git pull --rebase origin main
            git push
          fi

      - name: Generate audio for the published text
        run: node scripts/publish-audio.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish audio state
        run: |
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "audio: $(TZ=Asia/Tokyo date +%F)"
            git pull --rebase origin main
            git push
          fi

      - name: Verify audio availability
        run: test "$(cat .work/audio-state)" = ready
