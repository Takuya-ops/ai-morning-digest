name: daily-digest

on:
  schedule:
    # 20:30 UTC = 翌朝 5:30 JST(GitHub Actionsのcronは数分〜数十分遅延することがあります)
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      publish_existing:
        description: 'Republish existing news without calling AI APIs'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Republish existing text without API calls
        if: inputs.publish_existing
        run: node scripts/disable-audio-publication.js

      - name: Generate text
        if: ${{ !inputs.publish_existing }}
        run: node src/index.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "digest: $(TZ=Asia/Tokyo date +%F)"
            git pull --rebase origin main
            git push
          fi

      - name: Request text Pages build
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify public publication
        run: node scripts/verify-publication.js
