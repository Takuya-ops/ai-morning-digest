name: checks
on:
  pull_request:
    paths: ['src/**', 'scripts/**', 'static/**', 'tests/**', 'ios/**', 'package*.json', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      gemini_sample:
        description: 'Generate one Japanese Gemini TTS sample (uses API quota)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Generate Gemini audio sample
        if: github.event_name == 'workflow_dispatch' && inputs.gemini_sample
        run: node scripts/check-gemini-audio.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Save Gemini audio sample
        if: github.event_name == 'workflow_dispatch' && inputs.gemini_sample
        uses: actions/upload-artifact@v4
        with:
          name: gemini-audio-sample
          path: audio-check/
          retention-days: 7
