name: checks
on:
  pull_request:
    paths: ['src/**', 'tests/**', 'ios/**', 'package*.json', '.github/workflows/checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
