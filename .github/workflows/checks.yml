name: checks
on:
  pull_request:
    paths: ['src/**', 'scripts/**', 'static/**', 'tests/**', 'ios/**', 'package*.json', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      summary_sample:
        description: 'Check Gemini summary model (uses a small API call)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check Gemini summary model
        if: github.event_name == 'workflow_dispatch' && inputs.summary_sample
        run: node scripts/check-gemini-summary.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
